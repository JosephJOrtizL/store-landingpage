<ul class="social" [class.social--with-handles]="showHandles()">
  @for (link of links; track link.key) {
    <li>
      <a
        class="social__link"
        [href]="link.url"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="link.label + ' — ' + link.handle">

        <span class="social__icon" aria-hidden="true">
          @switch (link.key) {
            @case ('instagram') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="5"/>
                <circle cx="12" cy="12" r="4"/>
                <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
              </svg>
            }
            @case ('tiktok') {
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M16.5 3c.3 2 1.5 3.4 3.5 3.7v2.6c-1.3.1-2.6-.3-3.7-1v5.9c0 3.3-2.4 5.8-5.6
                         5.8S5 17.5 5 14.4c0-3 2.3-5.4 5.3-5.5.3 0 .6 0 .9.1v2.7c-.3-.1-.6-.2-.9-.2-1.6
                         0-2.8 1.3-2.8 2.9 0 1.7 1.2 3 2.9 3 1.7 0 2.9-1.2 2.9-3.1V3h3.2z"/>
              </svg>
            }
            @case ('whatsapp') {
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.8 4.9-1.3A10 10 0 1 0 12 2zm0 1.9a8.1 8.1 0 1
                         1-4.1 15.1l-.3-.2-2.9.8.8-2.8-.2-.3A8.1 8.1 0 0 1 12 3.9zm-3.2 4c-.2 0-.5.1-.7.4-.2.3-.9.9-.9
                         2.1s.9 2.4 1 2.6c.1.2 1.7 2.7 4.2 3.7 2.1.8 2.5.7 2.9.6.5 0 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2
                         0-.1-.2-.2-.5-.3l-1.7-.8c-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.1-.2
                         0-.4.1-.5l.4-.5c.1-.2.2-.3.2-.5s0-.3-.1-.4l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.4z"/>
              </svg>
            }
          }
        </span>

        @if (showHandles()) {
          <span class="social__handle">{{ link.handle }}</span>
        }
      </a>
    </li>
  }
</ul>
